plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.yink.amadeus'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.yink.amadeus.kurisutina'
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName '0.9.6-alpha.6'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Keep the original Java/android.support UI code intact for the first
    // build-system migration. AndroidX conversion is deliberately separated
    // from this compatibility baseline so visual/behavior regressions are easy
    // to isolate.
    implementation 'com.android.support:appcompat-v7:28.0.0'
}
