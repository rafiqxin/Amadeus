plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.yink.amadeus'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.yink.amadeus.kurisutina'
        minSdk 21
        targetSdk 36
        versionCode 3
        versionName '0.9.6-alpha.7'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Keep the original Java/android.support UI intact while restoring modern
    // Android runtime compatibility. AndroidX migration is intentionally kept
    // separate so visual and behavior regressions remain easy to isolate.
    implementation 'com.android.support:appcompat-v7:28.0.0'
}
